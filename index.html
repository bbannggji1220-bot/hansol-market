<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한솔마켓 | 제주동여자중학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --bg:#FCF7E8;
  --surface:#FFFFFF;
  --surface-2:#FFFDF6;
  --ink:#2B2013;
  --ink-soft:#786A4E;
  --border:#E9DFC0;
  --shadow:0 10px 30px -14px rgba(60,45,10,0.28);
  --accent:#E8791A;
  --accent-ink:#FFFFFF;
  --free:#2F9E44;
  --free-bg:#E8F6EA;
  --used:#1C7ED6;
  --used-bg:#E8F2FC;
  --auction:#E8590C;
  --auction-bg:#FDECDD;
  --danger:#D6455A;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Jua','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C160D;
    --surface:#282013;
    --surface-2:#312717;
    --ink:#F4EEDE;
    --ink-soft:#C7B994;
    --border:#453724;
    --shadow:0 10px 30px -14px rgba(0,0,0,0.5);
    --accent:#F0954A;
    --accent-ink:#20140A;
    --free:#5FD37A;
    --free-bg:#1D3324;
    --used:#6FB6F4;
    --used-bg:#182D42;
    --auction:#F49A5C;
    --auction-bg:#3A2413;
    --danger:#EC7A8B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C160D;
  --surface:#282013;
  --surface-2:#312717;
  --ink:#F4EEDE;
  --ink-soft:#C7B994;
  --border:#453724;
  --shadow:0 10px 30px -14px rgba(0,0,0,0.5);
  --accent:#F0954A;
  --accent-ink:#20140A;
  --free:#5FD37A;
  --free-bg:#1D3324;
  --used:#6FB6F4;
  --used-bg:#182D42;
  --auction:#F49A5C;
  --auction-bg:#3A2413;
  --danger:#EC7A8B;
  color-scheme:dark;
}

html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-family:var(--font-display);font-size:22px;color:var(--accent)}
.brand-sub{font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
.admin-pill{
  font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.admin-pill:hover{border-color:var(--accent);color:var(--accent)}
.admin-pill.is-on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}

.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:26px 28px;margin-bottom:28px;box-shadow:var(--shadow);
  display:grid;gap:20px;
}
.hero-text{overflow-x:auto}
.hero-text h1{font-size:clamp(20px,3.4vw,42px);color:var(--ink);white-space:nowrap}
.hero-text p{margin-top:10px;color:var(--ink-soft);white-space:nowrap}
.hero-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.meta-tile{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px}
.meta-tile svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}
.meta-label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.meta-tile p{font-size:14px;font-weight:500;margin-top:2px}
.hero-admin-row{display:flex;justify-content:flex-end;margin-top:4px}

.zone-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:28px}
.zone-nav-card{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:var(--radius-lg);border:1px solid var(--border);border-top-width:4px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s}
.zone-nav-card:hover{transform:translateY(-3px)}
.zone-nav-card .zone-icon{width:46px;height:46px;border-radius:14px;margin-bottom:4px}
.zone-nav-card .zone-icon svg{width:26px;height:26px}
.zone-nav-card h2{font-size:20px}
.zone-nav-card p{color:var(--ink-soft);font-size:13px}
.zone-nav-count{margin-top:6px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.zone-nav-cta{font-size:12.5px;font-weight:700}
.zone-nav-free{border-top-color:var(--free)}
.zone-nav-free .zone-icon{background:var(--free-bg);color:var(--free)}
.zone-nav-free .zone-nav-cta{color:var(--free)}
.zone-nav-used{border-top-color:var(--used)}
.zone-nav-used .zone-icon{background:var(--used-bg);color:var(--used)}
.zone-nav-used .zone-nav-cta{color:var(--used)}
.zone-nav-auction{border-top-color:var(--auction)}
.zone-nav-auction .zone-icon{background:var(--auction-bg);color:var(--auction)}
.zone-nav-auction .zone-nav-cta{color:var(--auction)}
.zone-nav-trade{border-top-color:var(--accent)}
.zone-nav-trade .zone-icon{background:var(--surface-2);color:var(--accent)}
.zone-nav-trade .zone-nav-cta{color:var(--accent)}

.temp-board{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:28px;box-shadow:var(--shadow)}
.temp-board-head{display:flex;align-items:flex-start;gap:10px}
.temp-board-head svg{width:24px;height:24px;color:var(--danger);flex:none;margin-top:2px}
.temp-board-head h2{font-size:19px;color:var(--ink)}
.temp-board-head p{color:var(--ink-soft);font-size:13px;margin-top:4px}
.temp-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.temp-card{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px}
.temp-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:var(--surface);border:1px solid var(--border);flex:none}
.temp-rank-1 .temp-rank{background:#F5C542;border-color:#F5C542;color:#5A3E00}
.temp-rank-2 .temp-rank{background:#D8D8D8;border-color:#D8D8D8;color:#3A3A3A}
.temp-rank-3 .temp-rank{background:#E3A165;border-color:#E3A165;color:#4A2A00}
.temp-info{display:flex;flex-direction:column;flex:1;min-width:0}
.temp-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.temp-count{font-size:11.5px;color:var(--ink-soft)}
.temp-value{font-weight:900;font-variant-numeric:tabular-nums;color:var(--danger);font-size:15px;flex:none}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:700;margin-bottom:16px}
.back-link:hover{color:var(--accent)}

.btn{border-radius:999px;border:1px solid transparent;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:filter .15s,background .15s}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.06)}

.item-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-md);padding:16px;margin:14px 0}
.event-form{margin-top:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.field-wide{grid-column:1/-1}
.field input,.field textarea,.field select{
  font:inherit;font-weight:400;color:var(--ink);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;resize:vertical;
}
.field-error{grid-column:1/-1;color:var(--danger);font-size:12.5px;margin:0}
.photo-field{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo-preview{width:56px;height:56px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface)}
.file-btn{display:inline-flex;align-items:center;cursor:pointer}
.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}

.zone{border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);padding:24px;margin-bottom:24px;box-shadow:var(--shadow)}
.zone-head{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}
.zone-title{display:flex;align-items:center;gap:10px}
.zone-icon{display:inline-flex;width:38px;height:38px;border-radius:12px;align-items:center;justify-content:center;flex:none}
.zone-icon svg{width:22px;height:22px}
.zone-title h2{font-size:22px}
.zone-tagline{margin-top:6px;color:var(--ink-soft);font-size:13.5px}
.zone-free .zone-icon{background:var(--free-bg);color:var(--free)}
.zone-free h2{color:var(--free)}
.zone-used .zone-icon{background:var(--used-bg);color:var(--used)}
.zone-used h2{color:var(--used)}
.zone-auction .zone-icon{background:var(--auction-bg);color:var(--auction)}
.zone-auction h2{color:var(--auction)}
.zone-trade .zone-icon{background:var(--surface-2);color:var(--accent)}
.zone-trade h2{color:var(--accent)}

.zone-info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:6px}
.zone-info-label{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.zone-info p{font-size:13.5px;color:var(--ink-soft)}

.zone-admin{display:flex;justify-content:flex-end;margin-top:10px}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.item-card{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px}
.item-photo{width:100%;height:150px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:10px;display:block;background:var(--surface)}
.item-photo-empty{display:flex;align-items:center;justify-content:center}
.item-photo-empty svg{width:34px;height:34px;opacity:.5}
.zone-free .item-photo-empty{background:var(--free-bg);color:var(--free)}
.zone-used .item-photo-empty{background:var(--used-bg);color:var(--used)}
.zone-auction .item-photo-empty{background:var(--auction-bg);color:var(--auction)}
.item-card h3{font-size:15.5px;font-family:var(--font-body);font-weight:700;padding-right:66px}
.item-desc{margin-top:6px;font-size:13px;color:var(--ink-soft)}
.item-meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.price{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px}
.zone-used .price{color:var(--used)}
.zone-auction .price{color:var(--auction)}
.chip{font-size:11.5px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 9px;color:var(--ink)}
.chip-soft{color:var(--ink-soft);font-weight:500}
.card-admin-btns{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:center}
.card-edit{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer;flex:none}
.card-edit:hover{border-color:var(--accent);color:var(--accent)}
.card-del{
  width:22px;height:22px;border-radius:50%;flex:none;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.card-del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.heart-btn{
  position:absolute;top:10px;left:10px;z-index:1;display:flex;align-items:center;gap:4px;
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  padding:4px 10px 4px 7px;cursor:pointer;color:var(--ink-soft);font-size:12px;font-weight:700;
}
.heart-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.heart-btn.is-liked{color:var(--danger);border-color:var(--danger)}
.heart-btn.is-liked svg{fill:var(--danger);stroke:var(--danger)}
.heart-count{font-variant-numeric:tabular-nums}
.empty-note{color:var(--ink-soft);font-size:13.5px;padding:10px 2px}

.bid-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bid-form{margin-top:10px}
.bid-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.bid-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px}
.bid-item-top{border-color:var(--auction);background:var(--auction-bg)}
.bid-item .price{font-weight:900;font-variant-numeric:tabular-nums;font-size:13px;margin-left:auto}
.bid-del{
  width:20px;height:20px;border-radius:50%;flex:none;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.bid-del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.bid-results{margin-top:14px;background:var(--auction-bg);border:1px solid var(--auction);border-radius:var(--radius-md);padding:14px 16px}
.bid-results h3{font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--auction);margin-bottom:8px}
.bid-result-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.bid-result-row:first-of-type{border-top:none}
.bid-result-name{flex:1;font-weight:700;font-size:13.5px}
.bid-result-winner{font-size:13px;color:var(--ink-soft)}

.trade-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.trade-card{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;flex-wrap:wrap}
.trade-main h3{font-size:15px;font-weight:700;font-family:var(--font-body)}
.trade-main .item-desc{margin-top:4px}
.trade-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trade-status-note{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.trade-admin{display:flex;gap:6px;align-items:center;flex:none}
.trade-del{
  width:22px;height:22px;border-radius:50%;flex:none;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.trade-del:hover{background:var(--danger);border-color:var(--danger);color:#fff}

.footer{text-align:center;padding:30px 0 6px;color:var(--ink-soft);font-family:var(--font-display);font-size:16px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;
  opacity:0;transition:opacity .2s,transform .2s;z-index:60;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,5,0.45);z-index:50}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:51;width:min(360px,86vw);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);
}
.modal h2{font-size:19px;margin-bottom:8px}
.modal p{color:var(--ink-soft);font-size:13.5px;margin-bottom:14px}
.modal #passcode-input{width:100%;font:inherit;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--ink)}
.modal .form-actions{margin-top:14px}

.loading-note{padding:60px 20px;text-align:center;color:var(--ink-soft)}

@media (max-width:760px){
  .hero-meta{grid-template-columns:1fr}
  .zone-info{grid-template-columns:1fr}
  .zone{padding:18px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}
</style>
</head>

<div id="root"><p class="loading-note">불러오는 중…</p></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

var firebaseConfig = {

  authDomain: "hansol-market.firebaseapp.com",
  databaseURL: "https://hansol-market-default-rtdb.firebaseio.com",
  projectId: "hansol-market",
  storageBucket: "hansol-market.firebasestorage.app",
  messagingSenderId: "824778047028",
  appId: "1:824778047028:web:299d44610d237928abd461"
};
var fbApp = initializeApp(firebaseConfig);
var db = getDatabase(fbApp);
var stateRef = ref(db, 'hansol');
var bidsRef = ref(db, 'hansolBids');
var bidsData = {};
var likesRef = ref(db, 'hansolLikes');
var likesData = {};

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function won(n){ return Number(n || 0).toLocaleString('ko-KR') + '원'; }
function uid(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function toast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.hidden = false;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.hidden = true; }, 200); }, 3000);
}

function fieldRowVal(name, label, val, type, required){
  type = type || 'text';
  return '<label class="field"><span>' + label + '</span><input type="' + type + '" name="' + name + '" value="' + escapeHtml(val) +
    '"' + (required ? ' required' : '') + (type === 'number' ? ' min="0" step="100"' : '') + '></label>';
}
function fieldRowSelect(name, label, options, selected){
  var opts = options.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === selected ? ' selected' : '') + '>' + escapeHtml(o[1]) + '</option>'; }).join('');
  return '<label class="field"><span>' + label + '</span><select name="' + name + '">' + opts + '</select></label>';
}

function computeTemps(state){
  var counts = {};
  function add(name){
    name = (name || '').trim();
    if(!name) return;
    counts[name] = (counts[name] || 0) + 1;
  }
  state.trades.forEach(function(t){ add(t.trader); });
  state.zones.free.forEach(function(it){ add(it.donor); });
  state.zones.used.forEach(function(it){ add(it.seller); });
  state.zones.auction.forEach(function(it){ add(it.registrant); });
  var list = Object.keys(counts).map(function(name){
    return { name: name, count: counts[name], temp: 36.5 + counts[name] * 0.3 };
  });
  list.sort(function(a, b){ return b.temp - a.temp || a.name.localeCompare(b.name); });
  return list;
}

function getItemBids(itemId){
  return bidsData[itemId] ? Object.keys(bidsData[itemId]).map(function(k){
    var b = bidsData[itemId][k];
    return { id: k, name: b.name, price: b.price, ts: b.ts };
  }) : [];
}

function renderBidSection(it, adminUnlocked){
  var itemBids = getItemBids(it.id);
  var isOpen = ui.biddingItem === it.id;
  var html = '<div class="bid-row">' +
    '<button type="button" class="btn btn-ghost btn-sm" data-action="toggle-bid" data-id="' + it.id + '">' + (isOpen ? '취소' : '입찰하기') + '</button>';
  if(adminUnlocked){
    var viewOpen = !!ui.viewingBids[it.id];
    html += '<button type="button" class="btn btn-ghost btn-sm" data-action="toggle-bid-view" data-id="' + it.id + '">' + (viewOpen ? '입찰 현황 숨기기' : '입찰 현황 보기 (' + itemBids.length + ')') + '</button>';
  }
  html += '</div>';
  if(isOpen){
    html += '<form class="item-form bid-form" id="bid-form-' + it.id + '" data-item="' + it.id + '">' +
      fieldRowVal('bidderName', '성함 *', '', 'text', true) +
      fieldRowVal('bidPrice', '경매가 (원) *', '', 'number', true) +
      '<div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">제출하기</button></div>' +
    '</form>';
  }
  if(adminUnlocked && ui.viewingBids[it.id]){
    if(itemBids.length){
      var sorted = itemBids.slice().sort(function(a, b){ return (b.price || 0) - (a.price || 0); });
      html += '<div class="bid-list">' + sorted.map(function(b, idx){
        return '<div class="bid-item' + (idx === 0 ? ' bid-item-top' : '') + '">' +
          '<span>' + escapeHtml(b.name) + '</span><span class="price">' + won(b.price) + '</span>' +
          '<button type="button" class="bid-del" data-action="delete-bid" data-item="' + it.id + '" data-bid="' + b.id + '" aria-label="삭제">×</button>' +
        '</div>';
      }).join('') + '</div>';
    } else {
      html += '<p class="empty-note">아직 입찰이 없어요.</p>';
    }
  }
  return html;
}

function renderBidResults(items){
  if(!items.length) return '<div class="bid-results"><p class="empty-note">등록된 경매 물품이 없어요.</p></div>';
  var rows = items.map(function(it){
    var itemBids = getItemBids(it.id);
    if(!itemBids.length){
      return '<div class="bid-result-row"><span class="bid-result-name">' + escapeHtml(it.name) + '</span><span class="empty-note">입찰 없음</span></div>';
    }
    var top = itemBids.reduce(function(a, b){ return (b.price || 0) > (a.price || 0) ? b : a; });
    return '<div class="bid-result-row"><span class="bid-result-name">' + escapeHtml(it.name) + '</span>' +
      '<span class="bid-result-winner">' + escapeHtml(top.name) + '</span>' +
      '<span class="price">' + won(top.price) + '</span></div>';
  }).join('');
  return '<div class="bid-results"><h3>입찰 결과 (최고가 기준)</h3>' + rows + '</div>';
}

function renderConfirmDeleteModal(ui, state){

  var title = '물품 삭제';
  if(cd && cd.kind === 'trade'){ name = '이 거래 기록'; title = '거래 기록 삭제'; }
  if(cd && cd.kind === 'bid'){ name = '이 입찰'; title = '입찰 삭제'; }
  if(cd){
    if(cd.kind === 'trade'){
      var tr = state.trades.filter(function(t){ return t.id === cd.id; })[0];
      if(tr) name = tr.name;
    } else if(cd.kind === 'bid'){
      var b = bidsData[cd.itemId] && bidsData[cd.itemId][cd.bidId] ? bidsData[cd.itemId][cd.bidId] : null;
      if(b) name = b.name + ' (' + won(b.price) + ')';
    } else {
      var item = state.zones[cd.zone] ? state.zones[cd.zone].filter(function(it){ return it.id === cd.id; })[0] : null;
      if(item) name = item.name;
    }

  return '<div class="modal-backdrop" data-action="cancel-delete"></div>' +
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<h2>' + title + '</h2><p>"' + escapeHtml(name) + '"을(를) 삭제할까요? 이 작업은 되돌릴 수 없어요.</p>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-delete">취소</button>' +

function processImage(file, callback){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxDim = 480;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = null;
      try{ dataUrl = canvas.toDataURL('image/jpeg', 0.72); }catch(err){ dataUrl = null; }
      callback(dataUrl);
    };
    img.onerror = function(){ callback(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

function onChange(e){
  var input = e.target;
  if(!input.classList || !input.classList.contains('photo-input')) return;
  var zone = input.getAttribute('data-zone');
  var file = input.files && input.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)){
    toast('이미지 파일만 선택할 수 있어요.');
    input.value = '';
    return;
  }
  processImage(file, function(dataUrl){
    if(!dataUrl){
      toast('사진을 처리하지 못했어요. 다른 사진으로 시도해주세요.');
      return;
    }
    ui.pendingImage[zone] = dataUrl;
    var preview = document.getElementById('preview-' + zone);
    if(preview){ preview.src = dataUrl; preview.hidden = false; }
    var clearBtn = document.querySelector('.photo-clear[data-zone="' + zone + '"]');
    if(clearBtn) clearBtn.hidden = false;
  });
}

function onClick(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');

  if(action === 'toggle-admin'){
    if(ui.adminUnlocked){
      ui.adminUnlocked = false;
      try{ sessionStorage.removeItem(SS_KEY); }catch(err){}
      rerender();
    } else {
      ui.showPasscode = true;
      ui.passcodeError = false;
      rerender();
      setTimeout(function(){ var el = document.getElementById('passcode-input'); if(el) el.focus(); }, 0);
    }
    return;
  }
  if(action === 'close-passcode'){
    ui.showPasscode = false;
    ui.passcodeError = false;
    rerender();
    return;
  }
  if(action === 'toggle-form'){
    var z = t.getAttribute('data-zone');
    ui.openForms[z] = !ui.openForms[z];
    ui.pendingImage[z] = null;
    ui.editingItem = null;
    if(z === 'trade') ui.editingTrade = null;
    rerender();
    if(ui.openForms[z]){
      setTimeout(function(){ var el = document.querySelector('#form-' + z + ' input[name="name"]'); if(el) el.focus(); }, 0);
    }
    return;
  }
  if(action === 'edit-item'){
    var ez = t.getAttribute('data-zone'), eid2 = t.getAttribute('data-id');
    var found = appState.zones[ez] ? appState.zones[ez].filter(function(x){ return x.id === eid2; })[0] : null;
    ui.openForms[ez] = true;
    ui.editingItem = eid2;
    ui.pendingImage[ez] = found && found.image ? found.image : null;
    rerender();
    setTimeout(function(){ var el = document.querySelector('#form-' + ez + ' input[name="name"]'); if(el) el.focus(); }, 0);
    return;
  }
  if(action === 'toggle-bid'){
    var bidItemId = t.getAttribute('data-id');
    ui.biddingItem = (ui.biddingItem === bidItemId) ? null : bidItemId;
    rerender();
    if(ui.biddingItem){
      setTimeout(function(){ var el = document.querySelector('#bid-form-' + bidItemId + ' input[name="bidderName"]'); if(el) el.focus(); }, 0);
    }
    return;
  }
  if(action === 'toggle-bid-view'){
    var viewItemId = t.getAttribute('data-id');
    ui.viewingBids[viewItemId] = !ui.viewingBids[viewItemId];
    rerender();
    return;
  }
  if(action === 'toggle-like'){
    var likeItemId = t.getAttribute('data-id');
    var wasLiked = !!likedItems[likeItemId];
    if(wasLiked){ delete likedItems[likeItemId]; } else { likedItems[likeItemId] = true; }
    try{ localStorage.setItem('hansol_liked', JSON.stringify(likedItems)); }catch(err){}
    rerender();
    runTransaction(ref(db, 'hansolLikes/' + likeItemId), function(current){
      var cur = current || 0;
      return wasLiked ? Math.max(0, cur - 1) : cur + 1;
    }).catch(function(err){});
    return;
  }
  if(action === 'toggle-trade-desk'){
    var newState0 = clone(appState);
    newState0.tradeDeskEnabled = !newState0.tradeDeskEnabled;
    commit(newState0);
    return;
  }
  if(action === 'toggle-bid-results'){
    ui.showBidResults = !ui.showBidResults;
    rerender();
    return;
  }
  if(action === 'delete-bid'){
    var dItemId = t.getAttribute('data-item'), dBidId = t.getAttribute('data-bid');
    ui.confirmDelete = { kind: 'bid', itemId: dItemId, bidId: dBidId };
    rerender();
    return;
  }
  if(action === 'edit-trade'){
    var eid = t.getAttribute('data-id');
    ui.openForms.trade = true;
    ui.editingTrade = eid;
    rerender();
    setTimeout(function(){ var el = document.querySelector('#form-trade input[name="name"]'); if(el) el.focus(); }, 0);
    return;
  }
  if(action === 'delete-trade'){
    var did = t.getAttribute('data-id');
    ui.confirmDelete = { kind: 'trade', id: did };
    rerender();
    return;
  }
  if(action === 'clear-photo'){
    var pz = t.getAttribute('data-zone');
    ui.pendingImage[pz] = null;
    var preview = document.getElementById('preview-' + pz);
    if(preview){ preview.hidden = true; preview.src = ''; }
    var fileInput = document.querySelector('.photo-input[data-zone="' + pz + '"]');
    if(fileInput) fileInput.value = '';
    t.hidden = true;
    return;
  }
  if(action === 'toggle-event-edit'){
    ui.editingEvent = !ui.editingEvent;
    rerender();
    return;
  }
  if(action === 'delete-item'){
    var zone = t.getAttribute('data-zone'), id = t.getAttribute('data-id');
    ui.confirmDelete = { kind: 'item', zone: zone, id: id };
    rerender();
    return;
  }
  if(action === 'cancel-delete'){
    ui.confirmDelete = null;
    rerender();
    return;
  }
  if(action === 'confirm-delete'){
    var cd = ui.confirmDelete;
    ui.confirmDelete = null;
    if(!cd) return;
    if(cd.kind === 'bid'){
      deleteBid(cd.itemId, cd.bidId);
      rerender();
      return;
    }
    var newState = clone(appState);
    if(cd.kind === 'trade'){
      newState.trades = newState.trades.filter(function(tr){ return tr.id !== cd.id; });
    } else {
      newState.zones[cd.zone] = newState.zones[cd.zone].filter(function(it){ return it.id !== cd.id; });
    }
    commit(newState);
    return;
  }
}

function onSubmit(e){
  var form = e.target;
  if(form.classList.contains('bid-form')){
    e.preventDefault();
    var itemId = form.getAttribute('data-item');
    var fdB = new FormData(form);
    var bName = (fdB.get('bidderName') || '').toString().trim();
    var bPrice = Number(fdB.get('bidPrice') || 0);
    if(!bName || !bPrice) return;
    var bidId = uid();
    set(ref(db, 'hansolBids/' + itemId + '/' + bidId), { name: bName, price: bPrice, ts: Date.now() }).then(function(){
      toast('입찰이 제출되었습니다. 결과는 마감 후 안내돼요.');
    }).catch(function(err){
      toast('입찰 제출에 실패했어요. 다시 시도해주세요.');
    });
    ui.biddingItem = null;
    rerender();
    return;
  }
  if(form.id === 'passcode-form'){
    e.preventDefault();
    var val = (new FormData(form)).get('code');
    val = (val || '').toString().trim();
    if(val && val === appState.adminCode){
      ui.adminUnlocked = true;
      ui.showPasscode = false;
      ui.passcodeError = false;
      try{ sessionStorage.setItem(SS_KEY, '1'); }catch(err){}
      rerender();
      toast('관리자 모드가 활성화되었습니다.');
    } else {
      ui.passcodeError = true;
      rerender();
    }
    return;
  }
  if(form.id === 'form-trade'){
    e.preventDefault();
    var fdT = new FormData(form);
    var tName = (fdT.get('name') || '').toString().trim();
    var tTrader = (fdT.get('trader') || '').toString().trim();
    if(!tName || !tTrader) return;
    var tradeData = {
      name: tName,
      trader: tTrader,
      zone: (fdT.get('zone') || 'etc').toString(),
      method: (fdT.get('method') || '').toString().trim(),
      price: Number(fdT.get('price') || 0),
      date: (fdT.get('date') || '').toString().trim()
    };
    var newStateT = clone(appState);
    if(ui.editingTrade){
      var idx = -1;
      for(var i = 0; i < newStateT.trades.length; i++){
        if(newStateT.trades[i].id === ui.editingTrade){ idx = i; break; }
      }
      if(idx > -1){
        tradeData.id = newStateT.trades[idx].id;
        tradeData.createdAt = newStateT.trades[idx].createdAt;
        newStateT.trades[idx] = tradeData;
      } else {
        tradeData.id = uid();
        tradeData.createdAt = Date.now();
        newStateT.trades = newStateT.trades.concat([tradeData]);
      }
    } else {
      tradeData.id = uid();
      tradeData.createdAt = Date.now();
      newStateT.trades = newStateT.trades.concat([tradeData]);
    }
    commit(newStateT);
    return;
  }
  if(form.classList.contains('item-form') && form.hasAttribute('data-zone') && form.getAttribute('data-zone') !== 'trade'){
    e.preventDefault();
    var zone = form.getAttribute('data-zone');
    var fd = new FormData(form);
    var name = (fd.get('name') || '').toString().trim();
    if(!name) return;
    var item = { name: name, desc: (fd.get('desc') || '').toString().trim() };
    if(ui.pendingImage[zone]) item.image = ui.pendingImage[zone];
    if(zone === 'free'){
      item.donor = (fd.get('donor') || '').toString().trim();
      item.limit = (fd.get('limit') || '').toString().trim();
    } else if(zone === 'used'){
      item.price = Number(fd.get('price') || 0);
      item.seller = (fd.get('seller') || '').toString().trim();
    } else if(zone === 'auction'){
      item.startPrice = Number(fd.get('startPrice') || 0);
      item.deadline = (fd.get('deadline') || '').toString().trim();
      item.registrant = (fd.get('registrant') || '').toString().trim();
    }
    var newState = clone(appState);
    if(ui.editingItem){
      var idx = -1;
      for(var j = 0; j < newState.zones[zone].length; j++){
        if(newState.zones[zone][j].id === ui.editingItem){ idx = j; break; }
      }
      if(idx > -1){
        item.id = newState.zones[zone][idx].id;
        newState.zones[zone][idx] = item;
      } else {
        item.id = uid();
        newState.zones[zone] = newState.zones[zone].concat([item]);
      }
    } else {
      item.id = uid();
      newState.zones[zone] = newState.zones[zone].concat([item]);
    }
    commit(newState);
    return;
  }
  if(form.id === 'event-form'){
    e.preventDefault();
    var fd2 = new FormData(form);
    var newState2 = clone(appState);
    newState2.event = {
      date: (fd2.get('date') || '').toString().trim(),
      place: (fd2.get('place') || '').toString().trim(),
      audience: (fd2.get('audience') || '').toString().trim(),
      purpose: (fd2.get('purpose') || '').toString().trim()
    };
    var newCode = (fd2.get('adminCode') || '').toString().trim();
    if(newCode) newState2.adminCode = newCode;
    commit(newState2);
    return;
  }
}

document.addEventListener('click', onClick);
document.addEventListener('submit', onSubmit);
document.addEventListener('change', onChange);
window.addEventListener('hashchange', function(){
  ui.page = parseHash();
  ui.openForms = {};
  ui.pendingImage = {};
  ui.editingEvent = false;
  ui.confirmDelete = null;
  ui.editingTrade = null;
  ui.editingItem = null;
  ui.biddingItem = null;
  ui.showBidResults = false;
  rerender();
  window.scrollTo(0, 0);
});

function normalizeState(val){
  val = val || {};
  val.event = val.event || {};
  val.event.date = val.event.date || '';
  val.event.place = val.event.place || '';
  val.event.audience = val.event.audience || '';
  val.event.purpose = val.event.purpose || '';
  val.adminCode = val.adminCode || '1007';
  val.zones = val.zones || {};
  val.zones.free = val.zones.free || [];
  val.zones.used = val.zones.used || [];
  val.zones.auction = val.zones.auction || [];
  val.trades = val.trades || [];
  val.tradeDeskEnabled = (typeof val.tradeDeskEnabled === 'boolean') ? val.tradeDeskEnabled : false;
  return val;
}

onValue(stateRef, function(snapshot){
  var val = snapshot.val();
  if(val){
    appState = normalizeState(val);
    rerender();
  } else if(!writing){
    set(stateRef, DEFAULT_STATE);
  }
}, function(err){
  document.getElementById('root').innerHTML = '<p class="loading-note">데이터를 불러오지 못했어요. Firebase 설정 또는 규칙을 확인해주세요.</p>';
});

onValue(bidsRef, function(snapshot){
  bidsData = snapshot.val() || {};
  rerender();
});

onValue(likesRef, function(snapshot){
  likesData = snapshot.val() || {};
  rerender();
});
</script>
</body>
</html>
